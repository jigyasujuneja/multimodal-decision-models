[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-decision-models"
version = "1.1.0"
description = "Model-agnostic calibrated multimodal decision models: four-paradigm backends, split conformal and RAPS prediction sets, L2 calibration, dual-buffer visual contact sheets, pluggable embedding shortlists, agent framework guards, context pruning, and MCP stdio routing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Jigyasu Juneja"}
]
dependencies = []

[project.scripts]
dgem-catalog-mcp = "multimodal_decision_models.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "EXE"]
ignore = ["E501"]
