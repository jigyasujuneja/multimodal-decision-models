name: CI

on:
  push:
    branches: ["main", "feat/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('push-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Go 1.22
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache: false

      - name: Run Python unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l ./pkg)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files: $unformatted"
            exit 1
          fi

      - name: Run Go vet, unit tests with race detector, and fuzz smoke
        run: |
          go vet ./pkg/...
          go test -race -v ./pkg/...
          go test -fuzz=FuzzNormalizeCosinePriorAndFusion -fuzztime=2s ./pkg/mdm

      - name: Validate Markdown links and heading anchors
        run: python scripts/docs_link_check.py

      - name: Public hygiene check
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          parts = [
              "googlers" + r"\.com",
              "corp" + r"\.google\.com",
              "decision" + "-lab",
              "/usr/local/" + "google",
              r"\." + "uplink" + r"\.goog",
              "artifact" + "-foundry",
          ]
          banned = re.compile("(" + "|".join(parts) + ")", re.I)
          hits = []
          for p in root.rglob("*"):
              if ".git" in p.parts or "__pycache__" in p.parts or "node_modules" in p.parts or p.is_dir():
                  continue
              try:
                  txt = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for idx, line in enumerate(txt.splitlines(), 1):
                  if banned.search(line):
                      hits.append(f"{p}:{idx}: {line.strip()}")
          if hits:
              print("Blocked internal references found:\n" + "\n".join(hits))
              sys.exit(1)
          print("Hygiene check clean: 0 blocked references.")
          PY
